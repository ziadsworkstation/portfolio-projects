<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziad Addami</title>
<meta name="description" content="Ziad Addami Ech Chaouy. Diseño de producto, diseño gráfico y música. Barcelona.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Crect x='5' y='5' width='22' height='22' fill='%23fff'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ziadaddami.es/">
<meta property="og:title" content="Ziad Addami">
<meta property="og:description" content="Diseño de producto, diseño gráfico y música. Barcelona.">
<meta property="og:image" content="https://ziadaddami.es/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#fff;--frame:#141414;--m:clamp(10px,4.5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--frame)}
body{background:var(--frame);color:var(--ink);font:500 12.5px/1.22 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;padding:var(--m)}
a{color:inherit;text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:2px;outline:none}
em{font-style:italic}
.panel{background:var(--paper);min-height:calc(100svh - 2 * var(--m));padding:10px 10px 12px;
  display:grid;grid-template-columns:minmax(0,1fr) var(--rw,24%);grid-template-rows:1fr auto;column-gap:clamp(16px,2.6vw,40px)}
.grid{grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,3.4fr) minmax(0,1.3fr) minmax(0,2.3fr);column-gap:clamp(16px,2.6vw,40px);align-items:start;align-content:start}
.bio p{max-width:34em}
ul{list-style:none}
.dis{white-space:nowrap}
.shot{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:6px}
figure{aspect-ratio:4/5;background:#eee;overflow:hidden}
figure img{width:100%;height:100%;object-fit:cover;display:block}
.dis button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.dis button:hover,.dis button:focus-visible,.dis button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:2px;outline:none}
figcaption{display:flex;justify-content:space-between;min-height:1.22em}
figcaption span:last-child{font-variant-numeric:tabular-nums}
footer{grid-column:1 / -1;grid-row:2;padding-top:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
#clock{font-variant-numeric:tabular-nums}
footer .big{font-size:clamp(18px,1.7vw,24px);letter-spacing:-.02em;line-height:1}
/* modo producto: la página se parte por la mitad, el texto a la izquierda y la foto llena la derecha */
.panel.prod{--rw:50%;height:calc(100svh - 2 * var(--m))}
.panel.prod .shot{grid-row:1 / -1}
.panel.prod figure{aspect-ratio:auto;flex:1;min-height:0;position:relative;cursor:pointer}
.panel.prod figure img{position:absolute;inset:0}
.panel.prod footer{grid-column:1}
@media (max-width:760px){
  .panel,.panel.prod{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .grid{grid-template-columns:1fr 1fr;row-gap:24px}
  .bio{grid-column:1 / -1}
  .shot,.panel.prod .shot{grid-column:1;grid-row:2;margin-top:24px}
  .panel.prod{height:auto}
  .panel.prod figure{aspect-ratio:4/5;flex:none}
  footer,.panel.prod footer{grid-row:3;grid-column:1}
}
</style>
</head>
<body>
<div class="panel">
  <main class="grid">
    <section class="bio">
      <p>Ziad Addami Ech Chaouy.<br>Diseñador en Barcelona.<br>Ingeniería de Diseño Industrial y Desarrollo de Producto, UPC.</p>
    </section>
    <ul class="dis" aria-label="Disciplinas">
      <li><button id="prod" aria-pressed="false">Diseño de producto</button></li>
      <li>Diseño gráfico</li>
      <li>Música</li>
    </ul>
    <ul class="links" aria-label="Links">
      <li><a href="https://www.instagram.com/ziadaddami/" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="https://www.linkedin.com/in/ziad-addami-3972b0280/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://open.spotify.com/artist/4rBc80vtgivw83wgakhUNW" target="_blank" rel="noopener">Spotify</a></li>
      <li><a href="mailto:contacto@ziadaddami.es">contacto@ziadaddami.es</a></li>
    </ul>
  </main>
  <div class="shot">
    <figure id="fig"><img id="shot" alt="Retrato de Ziad Addami"></figure>
    <figcaption id="cap" aria-live="polite"><span></span><span></span></figcaption>
  </div>
  <footer><span class="big">© 2026 Ziad Addami</span><span>Barcelona <time id="clock"></time></span></footer>
</div>
<script>
const srcOf = f => `img/${f}.webp`;
const clock = document.getElementById('clock'), fmt = new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' });
const tick = () => { clock.textContent = fmt.format(new Date()); };   // hora de Barcelona
tick(); setInterval(tick, 15000);

// «Diseño de producto»: la página se parte en dos y las fotos de producto llenan la mitad derecha
const PRODUCT = [
  ['altavoz-peana', 'Altavoz sobre peana de aluminio doblado'],
  ['altavoz-familia', 'Familia de altavoces lacados en cobalto'],
  ['altavoz-detalle', 'Detalle del lacado y el tweeter'],
  ['altavoz-contexto', 'Los altavoces en un escritorio, en una habitación de paredes desconchadas'],
];
const panel = document.querySelector('.panel'), shot = document.getElementById('shot'), fig = document.getElementById('fig'), prod = document.getElementById('prod');
const [capL, capR] = document.querySelectorAll('#cap span');
PRODUCT.forEach(([f]) => { const i = new Image(); i.src = srcOf(f); });
let n = -1;
function set(i) {
  n = i;
  const on = n >= 0;
  prod.setAttribute('aria-pressed', on); panel.classList.toggle('prod', on);
  if (!on) { shot.src = srcOf('retrato'); shot.alt = 'Retrato de Ziad Addami'; capL.textContent = capR.textContent = ''; return; }
  const [f, alt] = PRODUCT[n];
  shot.src = srcOf(f); shot.alt = alt;
  capL.textContent = 'Set de altavoces «Blew»'; capR.textContent = `${n + 1}/${PRODUCT.length}`;
}
const step = d => set((n + d + PRODUCT.length) % PRODUCT.length);
set(-1);
prod.addEventListener('click', () => set(n >= 0 ? -1 : 0));
fig.addEventListener('click', e => { if (n < 0) return; const r = fig.getBoundingClientRect(); step(e.clientX < r.left + r.width / 3 ? -1 : 1); });
addEventListener('keydown', e => {
  if (n < 0) return;
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') set(-1);
});
</script>
</body>
</html>
