<style>
:root{--ink:#111;--paper:#fff;--frame:#141414;--m:clamp(10px,4.5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--frame)}
body{background:var(--frame);color:var(--ink);font:500 12.5px/1.22 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;padding:var(--m)}
a{color:inherit;text-decoration:none}
a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:2px;outline:none}
em{font-style:italic}
.panel{background:var(--paper);min-height:calc(100svh - 2 * var(--m));padding:10px 10px 12px;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:minmax(0,3.4fr) minmax(0,1.3fr) minmax(0,2.3fr) minmax(0,2.4fr);column-gap:clamp(16px,2.6vw,40px);align-items:start}
.bio p{max-width:34em}
.bio p+p{margin-top:1.22em}
ul{list-style:none}
figure{aspect-ratio:4/5;cursor:default;background:#eee;overflow:hidden}
figure img{width:100%;height:100%;object-fit:cover;display:block}
.dis button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.dis button:hover,.dis button:focus-visible,.dis button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:2px;outline:none}
.shot{display:flex;flex-direction:column;gap:6px}
.shot figure.on{cursor:pointer}
figcaption{display:flex;justify-content:space-between;min-height:1.22em}
figcaption span:last-child{font-variant-numeric:tabular-nums}
footer{margin-top:auto;padding-top:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
#clock{font-variant-numeric:tabular-nums}
footer .big{font-size:clamp(18px,1.7vw,24px);letter-spacing:-.02em;line-height:1}
@media (max-width:760px){
  .grid{grid-template-columns:1fr 1fr;row-gap:24px}
  .bio{grid-column:1 / -1}
  .links{grid-column:auto}
  .shot{grid-column:1 / -1;max-width:420px}
}
</style>

  ['altavoz-familia', 'Familia de altavoces lacados en cobalto'],
  ['altavoz-detalle', 'Detalle del lacado y el tweeter'],
  ['altavoz-contexto', 'Los altavoces en un escritorio, en una habitación de paredes desconchadas'],
];
const shot = document.getElementById('shot'), fig = document.getElementById('fig'), prod = document.getElementById('prod');
const [capL, capR] = document.querySelectorAll('#cap span');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
PRODUCT.forEach(([f]) => { const i = new Image(); i.src = srcOf(f); });
let n = -1, timer = 0;
function set(i) {
  n = i; clearInterval(timer);
  const on = n >= 0;
  prod.setAttribute('aria-pressed', on); fig.classList.toggle('on', on);
  if (!on) { shot.src = srcOf('retrato'); shot.alt = 'Retrato de Ziad Addami'; capL.textContent = capR.textContent = ''; return; }
  const [f, alt] = PRODUCT[n];
  shot.src = srcOf(f); shot.alt = alt;
  capL.textContent = 'Set de altavoces «Blew»'; capR.textContent = `${n + 1}/${PRODUCT.length}`;
  if (!still) timer = setInterval(() => set((n + 1) % PRODUCT.length), 3500);
}
set(-1);
prod.addEventListener('click', () => set(n >= 0 ? -1 : 0));
fig.addEventListener('click', () => { if (n >= 0) set((n + 1) % PRODUCT.length); });
</script>
</body>
</html>
